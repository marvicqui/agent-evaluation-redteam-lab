name: Azure OIDC smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-oidc-smoke-dev
  cancel-in-progress: false

jobs:
  verify:
    name: Verify federated Azure access
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify subscription and project scope
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{subscription:name,state:state}' --output json
          az group show \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query '{name:name,location:location,provisioningState:properties.provisioningState}' \
            --output json

